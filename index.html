<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA MUSIC</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div class="waves">
        <span class="wave wave1"></span>
        <span class="wave wave2"></span>
        <span class="wave wave3"></span>

    </div>
    <div class="music-player">
        <div class="top">
             <h2>AURA</h2>
             <span><i class="ri-poker-hearts-line"></i></span>
        </div>
    <div class="album">
        <img src="https://images.unsplash.com/photo-1608728786215-8234c575dc34?q=80&w=1947&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" width="200" alt="album">

    </div>
    <div class="song">
        <h1>Perfect</h1>
        <p>Ed Sheeran</p>

    </div>

    <div class="progress">
        <div class="progress-fill"></div>
    </div>
    <div class="time">
        <span>1:24</span>
        <span>4:23</span>
    </div>

    <div class="controls">
          <button><i class="ri-rewind-fill"></i></button>  
        <button class="play"><i class="ri-arrow-right-s-fill"></i></button>
        <button>
           <i class="ri-speed-fill"></i> 
        </button>
    </div>
    <div class="volume">
        <i class="ri-volume-up-fill"></i>
        <input type="range" min="0" max="100" value="70">

    </div>
    </div>
    <div class="bubbles">
        <span class="bubble b1"></span>
         <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="bubble b4"></span>
        <span class="bubble b5"></span>
         <span class="bubble b6"></span>

    </div>
    </body>
    <div class="light light-one"></div>
    <div class="light light-two"></div>
    <div class="light light-three"></div>
</html>
